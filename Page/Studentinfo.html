<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="../Design/design.css">
        <title>Student Information</title>
    </head>
    <body>
        <div class="container">
           
            <form >
                <fieldset>
                    <legend>Student Information</legend>
                    <table> 
                        <tr> 
                            <td>
                                <label for="Name">Full Name(Text)</label>
                            <input type="text" id="Name" name="Name" placeholder="Enter Your Full Name"></td>
                            <td>
                                <label for="email">Email Address</label>
                                <input type="email" id="email" name="email" placeholder="your.email@example.com">
                            </td>
                            
                        </tr>
                      

                        <tr> 
                            <td>
                                <label for="pass">Password</label>
                            <input type="password" id="pass" name="pass" placeholder="Enter Secured Password"></td>
                            <td>
                                <label for="age">Age(Numbers)</label>
                                <input type="number" id="age" name="age" placeholder="Enter Your Age">
                            </td>
                            
                        </tr>

                    <tr> 
                            <td>
                                <label for="date">Experiment Date</label>
                                <input type="date" id="date" name="date" placeholder="Enter Experiment Date">
                            </td>
                            <td>
                                <label for="phone">Phone Number(Tel)</label>
                                <input type="tel" id="phone" name="phone" placeholder="+8801XXXXXXXXX">
                            </td>
                            
                        </tr>

                    </table>
                    
                </fieldset>
            </form>
            
            <input type="submit" value="SUBMIT">
           
            <input type="reset" value="CLEAR">
        </div>
    </body>
</html>
